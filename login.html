<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pinaki Ethos — Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;

            color: white;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(124, 58, 237, 0.30),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(6, 182, 212, 0.22),
                    transparent 35%
                ),
                #05050b;

            transition: 0.3s ease;
        }

        body.light-theme {
            color: #11111a;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(124, 58, 237, 0.16),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(6, 182, 212, 0.14),
                    transparent 35%
                ),
                #f5f6ff;
        }

        .orb {
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            pointer-events: none;
        }

        .orb1 {
            background: #7c3aed;
            top: -100px;
            left: -100px;
        }

        .orb2 {
            background: #06b6d4;
            bottom: -100px;
            right: -100px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 5;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .logo {
            color: inherit;
            text-decoration: none;
            font-size: 25px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .logo span {
            background: linear-gradient(
                90deg,
                #8b5cf6,
                #06b6d4
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .theme {
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.06);
            color: inherit;
            padding: 9px 13px;
            border-radius: 12px;
            cursor: pointer;
        }

        .card {
            padding: 38px;
            border-radius: 28px;

            background: rgba(12,12,23,0.82);

            border: 1px solid rgba(255,255,255,0.12);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.45),
                0 0 60px rgba(124,58,237,0.12);
        }

        .light-theme .card {
            background: rgba(255,255,255,0.85);
            border-color: rgba(20,20,40,0.10);

            box-shadow:
                0 30px 80px rgba(40,40,80,0.15);
        }

        .badge {
            display: inline-block;

            padding: 7px 12px;

            border-radius: 999px;

            font-size: 12px;
            font-weight: 800;

            color: #c4b5fd;

            background: rgba(124,58,237,0.12);

            border: 1px solid rgba(124,58,237,0.28);

            margin-bottom: 18px;
        }

        .light-theme .badge {
            color: #6941c6;
        }

        h1 {
            font-size: 40px;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9696a8;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .light-theme .subtitle {
            color: #666675;
        }

        .switch {
            display: grid;
            grid-template-columns: 1fr 1fr;

            padding: 5px;

            background: rgba(255,255,255,0.06);

            border-radius: 14px;

            margin-bottom: 25px;
        }

        .switch button {
            border: none;
            background: transparent;

            color: #9999aa;

            padding: 11px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 800;
        }

        .switch button.active {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #06b6d4
                );
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;

            font-size: 13px;
            font-weight: 800;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            border-radius: 13px;

            border: 1px solid rgba(255,255,255,0.13);

            background: rgba(255,255,255,0.055);

            color: inherit;

            outline: none;

            font-size: 15px;
        }

        .light-theme input {
            background: rgba(0,0,0,0.035);
            border-color: rgba(20,20,40,0.12);
        }

        input:focus {
            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px rgba(139,92,246,0.12);
        }

        .password {
            position: relative;
        }

        .password input {
            padding-right: 65px;
        }

        .show {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: #aaaabb;

            cursor: pointer;
        }

        .submit {
            width: 100%;

            border: none;

            border-radius: 14px;

            padding: 15px;

            margin-top: 5px;

            color: white;

            font-size: 15px;
            font-weight: 900;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #06b6d4
                );

            box-shadow:
                0 12px 30px rgba(124,58,237,0.28);

            transition: 0.2s ease;
        }

        .submit:hover {
            transform: translateY(-2px);
        }

        .submit:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .message {
            display: none;

            margin-top: 16px;

            padding: 13px;

            border-radius: 12px;

            font-size: 13px;

            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .message.error {
            color: #ffb4b4;

            background: rgba(239,68,68,0.10);

            border:
                1px solid rgba(239,68,68,0.20);
        }

        .message.success {
            color: #a7f3d0;

            background: rgba(16,185,129,0.10);

            border:
                1px solid rgba(16,185,129,0.20);
        }

        .security {
            text-align: center;

            color: #777789;

            font-size: 12px;

            line-height: 1.5;

            margin-top: 22px;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #a78bfa;

            text-decoration: none;

            font-size: 13px;

            font-weight: 800;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (max-width: 520px) {

            body {
                padding: 16px;
            }

            .card {
                padding: 27px 20px;
            }

            h1 {
                font-size: 34px;
            }
        }
    </style>

    <script defer crossorigin="anonymous" data-clerk-publishable-key="pk_test_ZGlyZWN0LWltcGFsYS01MzgyLmNsZXJrLmFjY291bnRzLmRldiQ" src="https://direct-impala-5382.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"></script>
</head>

<body>

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>


    <div class="container">

        <div class="top">

            <a href="index.html" class="logo">
                Prism <span>AI</span>
            </a>

            <button
                class="theme"
                id="themeButton"
                onclick="toggleTheme()">
                ☀️ Light
            </button>

        </div>


        <div class="card">

            <div class="badge">
                ✦ Pinaki Ethos ACCOUNT
            </div>


            <h1 id="heading">
                Welcome back.
            </h1>


            <p class="subtitle" id="description">
                Log in to continue your Pinaki Ethos experience.
            </p>


            <div id="clerk-auth" style="min-height: 360px;"></div>




            <div
                class="message"
                id="message">
            </div>


            <div class="security">
                🔒 Your password is sent directly to the
                Pinaki Ethos backend and securely hashed.
            </div>


            <a
                href="index.html"
                class="back">

                ← Back to Pinaki Ethos

            </a>

        </div>

    </div>


    <script>

        /* =========================================
           THEME
        ========================================= */

        function applyTheme() {

            const theme =
                localStorage.getItem("prismTheme");

            const button =
                document.getElementById("themeButton");

            if (theme === "light") {

                document.body.classList.add(
                    "light-theme"
                );

                button.textContent = "🌙 Dark";

            } else {

                document.body.classList.remove(
                    "light-theme"
                );

                button.textContent = "☀️ Light";
            }
        }


        function toggleTheme() {

            const body = document.body;

            const button =
                document.getElementById("themeButton");

            body.classList.toggle(
                "light-theme"
            );


            if (
                body.classList.contains(
                    "light-theme"
                )
            ) {

                localStorage.setItem(
                    "prismTheme",
                    "light"
                );

                button.textContent =
                    "🌙 Dark";

            } else {

                localStorage.setItem(
                    "prismTheme",
                    "dark"
                );

                button.textContent =
                    "☀️ Light";
            }
        }


        /* =========================================
           CLERK AUTHENTICATION
        ========================================= */

        async function initializeClerkAuth() {
            const host = document.getElementById("clerk-auth");
            const submitButton = document.getElementById("submitButton");

            try {
                if (!window.Clerk) {
                    throw new Error("Clerk could not load. Refresh the page and try again.");
                }

                await window.Clerk.load();

                const clerk = window.Clerk;

                async function saveClerkSession(state) {
                    const user = state?.user || clerk.user;
                    const session = state?.session || clerk.session;
                    if (!user || !session) return;

                    const email = user.primaryEmailAddress?.emailAddress ||
                        user.emailAddresses?.[0]?.emailAddress || "";
                    const name = user.fullName ||
                        [user.firstName, user.lastName].filter(Boolean).join(" ") ||
                        email.split("@")[0] || "Pinaki Ethos User";
                    const token = await session.getToken();
                    const legacyId = user.externalId || user.id;

                    localStorage.setItem("prismLoggedIn", "true");
                    localStorage.setItem("prismUserName", name);
                    localStorage.setItem("prismUserEmail", email);
                    localStorage.setItem("prismUserId", legacyId);
                    if (token) {
                        localStorage.setItem("prismAuthToken", token);
                        localStorage.setItem("prismToken", token);
                        localStorage.setItem("token", token);
                    }
                }

                clerk.addListener((state) => {
                    saveClerkSession(state).catch((error) =>
                        console.error("Could not sync Clerk session:", error)
                    );
                });

                if (clerk.isSignedIn) {
                    await saveClerkSession({ user: clerk.user, session: clerk.session });
                    window.location.replace("/index.html");
                    return;
                }

                clerk.mountSignIn(host, {
                    routing: "hash",
                    signInForceRedirectUrl: "/index.html",
                    signUpForceRedirectUrl: "/index.html",
                    signUpFallbackRedirectUrl: "/index.html",
                    signInFallbackRedirectUrl: "/index.html",
                    appearance: {
                        elements: {
                            rootBox: { width: "100%" },
                            card: { background: "transparent", boxShadow: "none", border: "none" }
                        }
                    }
                });
            } catch (error) {
                console.error("Clerk initialization failed:", error);
                showMessage(error.message || "Could not connect to Clerk.", "error");
            }
        }

        /* =========================================
           START
        ========================================= */

        applyTheme();
        initializeClerkAuth();

    </script>

</body>
</html>
