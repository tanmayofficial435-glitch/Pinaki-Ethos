<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prism AI — Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;

            color: white;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(124, 58, 237, 0.30),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(6, 182, 212, 0.22),
                    transparent 35%
                ),
                #05050b;

            transition: 0.3s ease;
        }

        body.light-theme {
            color: #11111a;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(124, 58, 237, 0.16),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(6, 182, 212, 0.14),
                    transparent 35%
                ),
                #f5f6ff;
        }

        .orb {
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            pointer-events: none;
        }

        .orb1 {
            background: #7c3aed;
            top: -100px;
            left: -100px;
        }

        .orb2 {
            background: #06b6d4;
            bottom: -100px;
            right: -100px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 5;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .logo {
            color: inherit;
            text-decoration: none;
            font-size: 25px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .logo span {
            background: linear-gradient(
                90deg,
                #8b5cf6,
                #06b6d4
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .theme {
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.06);
            color: inherit;
            padding: 9px 13px;
            border-radius: 12px;
            cursor: pointer;
        }

        .card {
            padding: 38px;
            border-radius: 28px;

            background: rgba(12,12,23,0.82);

            border: 1px solid rgba(255,255,255,0.12);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.45),
                0 0 60px rgba(124,58,237,0.12);
        }

        .light-theme .card {
            background: rgba(255,255,255,0.85);
            border-color: rgba(20,20,40,0.10);

            box-shadow:
                0 30px 80px rgba(40,40,80,0.15);
        }

        .badge {
            display: inline-block;

            padding: 7px 12px;

            border-radius: 999px;

            font-size: 12px;
            font-weight: 800;

            color: #c4b5fd;

            background: rgba(124,58,237,0.12);

            border: 1px solid rgba(124,58,237,0.28);

            margin-bottom: 18px;
        }

        .light-theme .badge {
            color: #6941c6;
        }

        h1 {
            font-size: 40px;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9696a8;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .light-theme .subtitle {
            color: #666675;
        }

        .switch {
            display: grid;
            grid-template-columns: 1fr 1fr;

            padding: 5px;

            background: rgba(255,255,255,0.06);

            border-radius: 14px;

            margin-bottom: 25px;
        }

        .switch button {
            border: none;
            background: transparent;

            color: #9999aa;

            padding: 11px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 800;
        }

        .switch button.active {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #06b6d4
                );
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;

            font-size: 13px;
            font-weight: 800;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            border-radius: 13px;

            border: 1px solid rgba(255,255,255,0.13);

            background: rgba(255,255,255,0.055);

            color: inherit;

            outline: none;

            font-size: 15px;
        }

        .light-theme input {
            background: rgba(0,0,0,0.035);
            border-color: rgba(20,20,40,0.12);
        }

        input:focus {
            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px rgba(139,92,246,0.12);
        }

        .password {
            position: relative;
        }

        .password input {
            padding-right: 65px;
        }

        .show {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: #aaaabb;

            cursor: pointer;
        }

        .submit {
            width: 100%;

            border: none;

            border-radius: 14px;

            padding: 15px;

            margin-top: 5px;

            color: white;

            font-size: 15px;
            font-weight: 900;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #06b6d4
                );

            box-shadow:
                0 12px 30px rgba(124,58,237,0.28);

            transition: 0.2s ease;
        }

        .submit:hover {
            transform: translateY(-2px);
        }

        .submit:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .message {
            display: none;

            margin-top: 16px;

            padding: 13px;

            border-radius: 12px;

            font-size: 13px;

            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .message.error {
            color: #ffb4b4;

            background: rgba(239,68,68,0.10);

            border:
                1px solid rgba(239,68,68,0.20);
        }

        .message.success {
            color: #a7f3d0;

            background: rgba(16,185,129,0.10);

            border:
                1px solid rgba(16,185,129,0.20);
        }

        .security {
            text-align: center;

            color: #777789;

            font-size: 12px;

            line-height: 1.5;

            margin-top: 22px;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #a78bfa;

            text-decoration: none;

            font-size: 13px;

            font-weight: 800;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (max-width: 520px) {

            body {
                padding: 16px;
            }

            .card {
                padding: 27px 20px;
            }

            h1 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>


    <div class="container">

        <div class="top">

            <a href="index.html" class="logo">
                Prism <span>AI</span>
            </a>

            <button
                class="theme"
                id="themeButton"
                onclick="toggleTheme()">
                ☀️ Light
            </button>

        </div>


        <div class="card">

            <div class="badge">
                ✦ PRISM AI ACCOUNT
            </div>


            <h1 id="heading">
                Welcome back.
            </h1>


            <p class="subtitle" id="description">
                Log in to continue your Prism AI experience.
            </p>


            <div class="switch">

                <button
                    id="loginTab"
                    class="active"
                    onclick="setMode('login')">

                    Log In

                </button>


                <button
                    id="signupTab"
                    onclick="setMode('signup')">

                    Sign Up

                </button>

            </div>


            <form id="authForm">

                <div
                    class="field"
                    id="nameField"
                    style="display:none;">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        id="name"
                        type="text"
                        placeholder="Enter your name"
                        autocomplete="name">

                </div>


                <div class="field">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required>

                </div>


                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <div class="password">

                        <input
                            id="password"
                            type="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            class="show"
                            id="showButton"
                            onclick="togglePassword()">

                            Show

                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="submit"
                    id="submitButton">

                    Log In →

                </button>

            </form>


            <div
                class="message"
                id="message">
            </div>


            <div class="security">
                🔒 Your password is sent directly to the
                Prism AI backend and securely hashed.
            </div>


            <a
                href="index.html"
                class="back">

                ← Back to Prism AI

            </a>

        </div>

    </div>


    <script>

        /* =========================================
           THEME
        ========================================= */

        function applyTheme() {

            const theme =
                localStorage.getItem("prismTheme");

            const button =
                document.getElementById("themeButton");

            if (theme === "light") {

                document.body.classList.add(
                    "light-theme"
                );

                button.textContent = "🌙 Dark";

            } else {

                document.body.classList.remove(
                    "light-theme"
                );

                button.textContent = "☀️ Light";
            }
        }


        function toggleTheme() {

            const body = document.body;

            const button =
                document.getElementById("themeButton");

            body.classList.toggle(
                "light-theme"
            );


            if (
                body.classList.contains(
                    "light-theme"
                )
            ) {

                localStorage.setItem(
                    "prismTheme",
                    "light"
                );

                button.textContent =
                    "🌙 Dark";

            } else {

                localStorage.setItem(
                    "prismTheme",
                    "dark"
                );

                button.textContent =
                    "☀️ Light";
            }
        }


        /* =========================================
           AUTH MODE
        ========================================= */

        let mode = "login";


        function setMode(newMode) {

            mode = newMode;

            const loginTab =
                document.getElementById(
                    "loginTab"
                );

            const signupTab =
                document.getElementById(
                    "signupTab"
                );

            const nameField =
                document.getElementById(
                    "nameField"
                );

            const heading =
                document.getElementById(
                    "heading"
                );

            const description =
                document.getElementById(
                    "description"
                );

            const submitButton =
                document.getElementById(
                    "submitButton"
                );


            clearMessage();


            if (mode === "signup") {

                loginTab.classList.remove(
                    "active"
                );

                signupTab.classList.add(
                    "active"
                );

                nameField.style.display =
                    "block";

                heading.textContent =
                    "Create your account.";

                description.textContent =
                    "Join Prism AI and start creating.";

                submitButton.textContent =
                    "Create Account →";

            } else {

                signupTab.classList.remove(
                    "active"
                );

                loginTab.classList.add(
                    "active"
                );

                nameField.style.display =
                    "none";

                heading.textContent =
                    "Welcome back.";

                description.textContent =
                    "Log in to continue your Prism AI experience.";

                submitButton.textContent =
                    "Log In →";
            }
        }


        /* =========================================
           PASSWORD
        ========================================= */

        function togglePassword() {

            const password =
                document.getElementById(
                    "password"
                );

            const button =
                document.getElementById(
                    "showButton"
                );


            if (
                password.type === "password"
            ) {

                password.type = "text";

                button.textContent =
                    "Hide";

            } else {

                password.type = "password";

                button.textContent =
                    "Show";
            }
        }


        /* =========================================
           MESSAGE
        ========================================= */

        function showMessage(
            text,
            type
        ) {

            const message =
                document.getElementById(
                    "message"
                );

            message.textContent = text;

            message.className =
                "message show " + type;
        }


        function clearMessage() {

            const message =
                document.getElementById(
                    "message"
                );

            message.textContent = "";

            message.className =
                "message";
        }


        /* =========================================
           FORM
        ========================================= */

        document
            .getElementById("authForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();

                    clearMessage();


                    const name =
                        document
                            .getElementById("name")
                            .value
                            .trim();

                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();

                    const password =
                        document
                            .getElementById("password")
                            .value;


                    if (
                        mode === "signup" &&
                        name.length === 0
                    ) {

                        showMessage(
                            "Please enter your name.",
                            "error"
                        );

                        return;
                    }


                    const submitButton =
                        document.getElementById(
                            "submitButton"
                        );

                    submitButton.disabled =
                        true;


                    submitButton.textContent =
                        mode === "signup"
                            ? "Creating Account..."
                            : "Logging In...";


                    try {

                        /*
                         * IMPORTANT:
                         *
                         * Because login.html is being
                         * opened through:
                         *
                         * http://localhost:3000/login.html
                         *
                         * this URL automatically goes
                         * to the same Prism AI server.
                         */

                        const endpoint =
                            mode === "signup"
                                ? "/api/auth/signup"
                                : "/api/auth/login";


                        const requestData =
                            mode === "signup"
                                ? {
                                    name: name,
                                    email: email,
                                    password: password
                                }
                                : {
                                    email: email,
                                    password: password
                                };


                        console.log(
                            "Sending authentication request:",
                            endpoint
                        );


                        const response =
                            await fetch(
                                endpoint,
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            requestData
                                        )
                                }
                            );


                     const responseText = await response.text();

console.log("HTTP STATUS:", response.status);
console.log("RAW BACKEND RESPONSE:", responseText);

let data;

try {
    data = JSON.parse(responseText);
} catch (parseError) {
    throw new Error(
        "Backend returned an invalid response: " +
        responseText
    );
}

console.log("BACKEND DATA:", data);


                       if (
    !response.ok ||
    !data.ok ||
    !data.user
) {

    throw new Error(
        data.error ||
        "Authentication failed."
    );
}


                        /*
                         * SAVE USER INFORMATION
                         */

                        localStorage.setItem(
                            "prismLoggedIn",
                            "true"
                        );

                        localStorage.setItem(
                            "prismUserName",
                            data.user.name
                        );

                        localStorage.setItem(
                            "prismUserEmail",
                            data.user.email
                        );

                        localStorage.setItem(
                            "prismUserId",
                            data.user.id
                        );
                        if (data.token) {

    localStorage.setItem(
        "prismAuthToken",
        data.token
    );

    localStorage.setItem(
        "prismToken",
        data.token
    );

    localStorage.setItem(
        "token",
        data.token
    );
}


                        showMessage(
                            mode === "signup"
                                ? "Account created successfully!"
                                : "Login successful!",
                            "success"
                        );


                        submitButton.textContent =
                            "Success ✓";


                        /*
                         * GO HOME
                         */

                        setTimeout(
                            function() {

                                window.location.href =
                                    "/index.html";

                            },
                            900
                        );


                    } catch (error) {

                        console.error(
                            "Authentication error:",
                            error
                        );


                        showMessage(
                            error.message ||
                            "Could not connect to the Prism AI backend.",
                            "error"
                        );


                        submitButton.disabled =
                            false;


                        submitButton.textContent =
                            mode === "signup"
                                ? "Create Account →"
                                : "Log In →";
                    }

                }
            );


        /* =========================================
           START
        ========================================= */

        applyTheme();

    </script>

</body>
</html>
