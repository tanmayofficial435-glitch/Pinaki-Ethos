<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Media Studio — Prism AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at 12% 10%,rgba(168,85,247,.18),transparent 30%),
        radial-gradient(circle at 88% 20%,rgba(14,165,233,.12),transparent 30%),
        linear-gradient(135deg,#080812,#100b1d,#080812);
}

body.light-theme{
    color:#171528;
    background:
        radial-gradient(circle at 15% 10%,rgba(124,58,237,.12),transparent 32%),
        radial-gradient(circle at 85% 20%,rgba(6,182,212,.10),transparent 30%),
        linear-gradient(135deg,#f8f7ff,#eef2ff 52%,#f7fbff);
}

nav{
    height:76px;
    padding:0 7%;
    display:flex;
    align-items:center;
    gap:30px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(8,8,18,.72);
    backdrop-filter:blur(18px);
    position:sticky;
    top:0;
    z-index:10;
}

.light-theme nav{
    background:rgba(255,255,255,.72);
    border-color:rgba(30,20,80,.08);
}

.logo{
    font-size:21px;
    font-weight:800;
    margin-right:auto;
}

.logo span{
    color:#a78bfa;
}

nav a{
    color:inherit;
    text-decoration:none;
    opacity:.78;
    font-size:14px;
}

nav a:hover{
    opacity:1;
}

.theme{
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);
    color:inherit;
    padding:10px 15px;
    border-radius:12px;
    cursor:pointer;
}

.light-theme .theme{
    border-color:rgba(40,30,100,.12);
    background:rgba(255,255,255,.65);
}

main{
    width:min(1100px,92%);
    margin:auto;
    padding:78px 0 100px;
}

.hero{
    text-align:center;
    margin-bottom:42px;
}

.badge{
    display:inline-block;
    padding:8px 15px;
    border-radius:999px;
    background:rgba(168,85,247,.12);
    border:1px solid rgba(168,85,247,.25);
    color:#d0b5ff;
    font-size:13px;
    margin-bottom:20px;
}

.light-theme .badge{
    color:#6334c7;
}

h1{
    font-size:clamp(38px,6vw,68px);
    letter-spacing:-2px;
    margin-bottom:18px;
}

.gradient{
    background:linear-gradient(90deg,#c084fc,#67e8f9);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.hero p{
    max-width:700px;
    margin:auto;
    opacity:.68;
    line-height:1.7;
    font-size:17px;
}

.panel{
    border:1px solid rgba(255,255,255,.09);
    background:rgba(17,16,30,.76);
    border-radius:28px;
    padding:30px;
    box-shadow:0 25px 80px rgba(0,0,0,.25);
}

.light-theme .panel{
    background:rgba(255,255,255,.72);
    border-color:rgba(40,30,100,.10);
    box-shadow:0 25px 70px rgba(80,70,150,.12);
}

label{
    display:block;
    font-size:13px;
    opacity:.7;
    margin-bottom:9px;
}

input,textarea,select{
    width:100%;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.1);
    background:#0b0b16;
    color:#fff;
    padding:15px;
    font-size:15px;
    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#8b5cf6;
}

.light-theme input,
.light-theme textarea,
.light-theme select{
    background:#fff;
    color:#171528;
    border-color:rgba(40,30,100,.12);
}

.field{
    margin-bottom:20px;
}

textarea{
    min-height:170px;
    resize:vertical;
    line-height:1.6;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.generate{
    width:100%;
    padding:16px;
    border:0;
    border-radius:16px;
    background:linear-gradient(135deg,#a855f7,#6366f1);
    color:#fff;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 15px 35px rgba(99,102,241,.25);
}

.generate:hover{
    transform:translateY(-2px);
}

.status{
    text-align:center;
    margin-top:18px;
    opacity:.7;
}

.result{
    display:none;
    margin-top:25px;
    padding:25px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(0,0,0,.18);
    white-space:pre-wrap;
    line-height:1.7;
}

.light-theme .result{
    background:rgba(240,238,255,.7);
    border-color:rgba(40,30,100,.08);
}

@media(max-width:700px){

    nav{
        padding:0 20px;
    }

    nav a{
        display:none;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .panel{
        padding:20px;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">✦ <span>Prism AI</span></div>

    <a href="index.html">Home</a>
    <a href="features.html">Features</a>
    <a href="workspace.html">Workspace</a>
    <a href="pricing.html">Pricing</a>

    <button class="theme"
            id="themeButton"
            onclick="toggleTheme()">
        ☀️ Light
    </button>
</nav>

<main>

<section class="hero">

    <div class="badge">📱 Prism Creative Studio</div>

    <h1>
        Social Media <span class="gradient">Studio.</span>
    </h1>

    <p>
        Turn one idea into polished social content,
        captions, hooks and platform-ready posts.
    </p>

</section>

<section class="panel">

<div class="field">

<label for="brand">
Brand / Project Name
</label>

<input
    id="brand"
    placeholder="Example: Prism Science Club">

</div>

<div class="field">

<label for="topic">
What do you want to post about?
</label>

<textarea
    id="topic"
    placeholder="Describe your project, event, product, announcement or idea..."></textarea>

</div>

<div class="grid">

<div class="field">

<label for="platform">
Platform
</label>

<select id="platform">

<option>Instagram</option>
<option>YouTube</option>
<option>LinkedIn</option>
<option>Facebook</option>
<option>X</option>
<option>General Social Media</option>

</select>

</div>

<div class="field">

<label for="tone">
Tone
</label>

<select id="tone">

<option>Creative</option>
<option>Professional</option>
<option>Educational</option>
<option>Fun</option>
<option>Inspirational</option>
<option>Minimal</option>

</select>

</div>

</div>

<button class="generate"
        onclick="generateSocialContent()">

    ✦ Create Social Content

</button>

<div class="status" id="status"></div>

<div class="result" id="result"></div>

</section>

</main>

<script>

async function generateSocialContent(){

    const brand =
        document.getElementById("brand").value.trim();

    const topic =
        document.getElementById("topic").value.trim();

    const platform =
        document.getElementById("platform").value;

    const tone =
        document.getElementById("tone").value;

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");

    if(!topic){

        status.textContent =
            "Please describe what you want to post about.";

        return;
    }

    status.textContent =
        "✦ Prism is creating your social content...";

    result.style.display = "none";

    const prompt = `
Create social media content for:

Brand / Project:
${brand || "Not specified"}

Topic:
${topic}

Platform:
${platform}

Tone:
${tone}
`;

    const system = `

You are Prism AI's Social Media Studio.

Create useful, polished social media content.

Return:

1. Post Concept
2. Attention-Grabbing Hook
3. Main Caption
4. Short Caption
5. Call To Action
6. Suggested Hashtags
7. Visual Direction
8. Alternative Hook
9. Alternative Caption
10. Posting Suggestions

Adapt the writing to the selected platform and tone.

Do not invent factual claims about the user's project.

`;

    try{

        const response = await fetch("/api/ai", {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                prompt:prompt,

                system:system,

                tool:"social-media-studio"

            })

        });

        const data = await response.json();

        if(!response.ok){

            throw new Error(
                data.error || "AI request failed"
            );

        }

        const answer =
            data.response ||
            data.answer ||
            data.message ||
            data.text ||
            "";

        result.textContent = answer ||
            "Prism could not generate the content.";

        result.style.display = "block";

        status.textContent =
            "✨ Social content generated.";

    }catch(error){

        status.textContent =
            "❌ " + error.message;

    }

}

function applyTheme(){

    const theme =
        localStorage.getItem("prismTheme") || "dark";

    document.body.classList.toggle(
        "light-theme",
        theme === "light"
    );

    document.getElementById("themeButton").textContent =
        theme === "light"
        ? "🌙 Dark"
        : "☀️ Light";
}

function toggleTheme(){

    const light =
        document.body.classList.toggle("light-theme");

    localStorage.setItem(
        "prismTheme",
        light ? "light" : "dark"
    );

    document.getElementById("themeButton").textContent =
        light ? "🌙 Dark" : "☀️ Light";
}

applyTheme();

</script>

</body>
</html>
