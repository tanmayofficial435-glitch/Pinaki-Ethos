<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prism Magic — Prism AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    color:#fff;
    background:
    radial-gradient(circle at 15% 15%,rgba(139,92,246,.22),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(34,211,238,.14),transparent 28%),
    linear-gradient(135deg,#070710,#100b20,#070710);
}

body.light-theme{
    color:#171528;
    background:
    radial-gradient(circle at 15% 10%,rgba(124,58,237,.12),transparent 32%),
    radial-gradient(circle at 85% 20%,rgba(6,182,212,.10),transparent 30%),
    linear-gradient(135deg,#f8f7ff,#eef2ff 52%,#f7fbff);
}

nav{
    height:76px;
    padding:0 7%;
    display:flex;
    align-items:center;
    gap:28px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(7,7,16,.72);
    backdrop-filter:blur(18px);
    position:sticky;
    top:0;
    z-index:10;
}

.light-theme nav{
    background:rgba(255,255,255,.72);
    border-color:rgba(30,20,80,.08);
}

.logo{
    margin-right:auto;
    font-size:21px;
    font-weight:800;
}

.logo span{color:#a78bfa}

nav a{
    color:inherit;
    text-decoration:none;
    opacity:.75;
    font-size:14px;
}

nav a:hover{opacity:1}

.theme{
    color:inherit;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;
    padding:10px 15px;
    cursor:pointer;
}

main{
    width:min(1100px,92%);
    margin:auto;
    padding:75px 0 100px;
}

.hero{text-align:center;margin-bottom:42px}

.magic-symbol{
    width:80px;
    height:80px;
    margin:0 auto 22px;
    display:grid;
    place-items:center;
    border-radius:25px;
    font-size:38px;
    background:linear-gradient(135deg,#8b5cf6,#06b6d4);
    box-shadow:
        0 0 50px rgba(139,92,246,.28),
        0 0 90px rgba(6,182,212,.12);
}

h1{
    font-size:clamp(42px,7vw,76px);
    letter-spacing:-3px;
    margin-bottom:18px;
}

.gradient{
    background:linear-gradient(90deg,#c084fc,#67e8f9,#a78bfa);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.hero p{
    max-width:720px;
    margin:auto;
    opacity:.68;
    line-height:1.7;
    font-size:17px;
}

.panel{
    padding:32px;
    border-radius:30px;
    background:rgba(17,16,30,.78);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 25px 90px rgba(0,0,0,.28);
}

.light-theme .panel{
    background:rgba(255,255,255,.74);
    border-color:rgba(40,30,100,.1);
    box-shadow:0 25px 70px rgba(80,70,150,.12);
}

label{
    display:block;
    font-size:13px;
    opacity:.7;
    margin-bottom:10px;
}

textarea{
    width:100%;
    min-height:230px;
    resize:vertical;
    border-radius:20px;
    padding:20px;
    font-size:16px;
    line-height:1.6;
    outline:none;
    color:#fff;
    background:#0b0b16;
    border:1px solid rgba(255,255,255,.1);
}

textarea:focus{
    border-color:#8b5cf6;
    box-shadow:0 0 0 3px rgba(139,92,246,.1);
}

.light-theme textarea{
    color:#171528;
    background:#fff;
    border-color:rgba(40,30,100,.12);
}

.actions{
    display:flex;
    gap:12px;
    margin-top:20px;
}

button.magic{
    flex:1;
    border:0;
    border-radius:17px;
    padding:17px;
    color:#fff;
    font-size:16px;
    font-weight:750;
    cursor:pointer;
    background:linear-gradient(135deg,#8b5cf6,#6366f1,#06b6d4);
    box-shadow:0 16px 40px rgba(99,102,241,.25);
}

button.magic:hover{
    transform:translateY(-2px);
}

.status{
    text-align:center;
    margin-top:18px;
    opacity:.7;
}

.result{
    display:none;
    margin-top:25px;
    padding:26px;
    border-radius:21px;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(0,0,0,.18);
    white-space:pre-wrap;
    line-height:1.75;
}

.light-theme .result{
    background:rgba(240,238,255,.7);
    border-color:rgba(40,30,100,.08);
}

@media(max-width:700px){
    nav{padding:0 20px}
    nav a{display:none}
    .panel{padding:20px}
    .actions{flex-direction:column}
}
</style>
</head>

<body>

<nav>
    <div class="logo">✦ <span>Prism AI</span></div>
    <a href="index.html">Home</a>
    <a href="features.html">Features</a>
    <a href="workspace.html">Workspace</a>
    <a href="pricing.html">Pricing</a>
    <button class="theme" id="themeButton" onclick="toggleTheme()">☀️ Light</button>
</nav>

<main>

<section class="hero">

    <div class="magic-symbol">✦</div>

    <h1>
        <span class="gradient">Prism Magic</span>
    </h1>

    <p>
        Give Prism a goal. Let it understand what you are trying
        to accomplish and work out the right way to help.
    </p>

</section>

<section class="panel">

<label for="magicInput">
What do you want to accomplish?
</label>

<textarea
id="magicInput"
placeholder="Tell Prism what you want...

Example:
I have to make a school project about space exploration.
I need research, a structure, presentation ideas and a way
to explain it clearly to my class."></textarea>

<div class="actions">

<button class="magic" onclick="runMagic()">
    ✦ Let Prism Handle It
</button>

</div>

<div class="status" id="status"></div>

<div class="result" id="result"></div>

</section>

</main>

<script>

async function runMagic(){

    const input =
        document.getElementById("magicInput").value.trim();

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");

    if(!input){

        status.textContent =
            "Tell Prism what you want to accomplish.";

        return;
    }

    status.textContent =
        "✦ Prism is understanding your goal...";

    result.style.display = "none";

    const system = `

You are Prism Magic.

The user gives you a goal rather than a specific tool.

Understand the goal first.

Decide what kinds of help would be useful.

Return:

1. Goal Understanding
2. What Needs To Be Done
3. Recommended Approach
4. First Step
5. Suggested Workflow
6. Useful Prism Features
7. Final Guidance

Do not pretend that actions were completed when they were not.

Be practical and student-friendly when appropriate.

`;

    try{

        const response = await fetch("/api/ai",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                prompt:input,

                system:system,

                tool:"prism-magic"

            })

        });

        const data = await response.json();

        if(!response.ok){

            throw new Error(
                data.error || "AI request failed"
            );

        }

        const answer =
            data.response ||
            data.answer ||
            data.message ||
            data.text ||
            "";

        result.textContent =
            answer || "Prism could not generate a response.";

        result.style.display = "block";

        status.textContent =
            "✨ Prism Magic completed.";

    }catch(error){

        status.textContent =
            "❌ " + error.message;

    }

}

function applyTheme(){

    const theme =
        localStorage.getItem("prismTheme") || "dark";

    document.body.classList.toggle(
        "light-theme",
        theme === "light"
    );

    document.getElementById("themeButton").textContent =
        theme === "light"
        ? "🌙 Dark"
        : "☀️ Light";
}

function toggleTheme(){

    const light =
        document.body.classList.toggle("light-theme");

    localStorage.setItem(
        "prismTheme",
        light ? "light" : "dark"
    );

    document.getElementById("themeButton").textContent =
        light ? "🌙 Dark" : "☀️ Light";
}

applyTheme();

</script>

</body>
</html>
